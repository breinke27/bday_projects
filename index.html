<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppy Website</title>
    <style>
        body {
            background-color: #f0e6ff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #663399;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        h3 {
            color: #4a4a4a;
            margin: 20px 0;
            font-size: 1.4em;
        }

        .birthday-message {
            color: #ff69b4;
            font-size: 1.2em;
            font-weight: bold;
            margin: 20px 0;
        }

        .image-container {
            margin: 30px 0;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin: 30px 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #663399;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #4a2476;
        }

        .links-section {
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Poppy Website!</h1>
        <h3>A website for you to see this cute hippo whenever you want to!</h3>
        
        <div class="birthday-message">
            Happy 22nd Birthday! I Love you! 🎉🎈
        </div>

        <div class="image-container">
            <img src="Images/hippobaby2.jpg" alt="Baby Hippo">
        </div>

        <div class="links-section">
            <a href="https://www.youtube.com/live/NNWdbLaIwK8?si=QqA1C7O-kh_qt_WJ" target="_blank">Watch Poppy Live Stream</a>
            <a href="https://metrorichmondzoo.com/animals/poppy-the-pygmy-hippo/" target="_blank">More Info About Poppy</a>
        </div>
    </div>
</body>
</html>
